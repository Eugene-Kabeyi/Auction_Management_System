<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login </title>

    <style>
        /* Body */
        body {
            font-family: "Segoe UI", Tahoma, Arial, sans-serif;
            background-color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #374151;
        }

        /* Login container */
        .login_container {
            position: relative;
            width: 420px;
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 32px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        

        /* Logo */
        .logo {
            display: block;
            width: 48px;
            height: 48px;
            margin: 12px auto;
            background-color: #1f2933;
            color: #ffffff;
            font-weight: 700;
            font-size: 18px;
            border-radius: 6px;
            line-height: 48px;
            text-align: center;
        }

        /* Headings */
        .login_container h2 {
            font-size: 18px;
            font-weight: 600;
            color: #111827;
        }

        .login_container h3 {
            font-size: 15px;
            font-weight: 500;
            color: #6b7280;
            margin-bottom: 20px;
        }

        /* Form */
        .login_form {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        /* Labels */
        .login_form label {
            font-size: 13px;
            font-weight: 500;
            margin-top: 14px;
            color: #374151;
        }

        /* Inputs */
        .login_form input[type="text"],
        .login_form input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.2s ease;
        }

        .login_form input:focus {
            border-color: #1f2933;
            outline: none;
        }

        /* Submit button */
        .login_form button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background-color: #1f2933;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .login_form button:hover {
            background-color: #374151;
        }

        /* Responsive - hide left decoration on small screens */
        @media (max-width: 900px) {

            .login_container {
                width: 90%;
                margin: auto;
            }
        }
    </style>
</head>

<body>
    <div class="login_container">
        
        <h2>Welcome to AMS</h2>
        <span class="logo">AMS</span>
        <h3>Log In</h3>
        <form action="/handle_login.php" method="post" class="login_form">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="text" id="password" name="password" required>

            <button type="submit">Log In</button>
        </form>
    </div>
    <script>
        // Validation of password field to ensure it is not empty and making it a password type
        document.getElementById('password').setAttribute('type', 'password');
    </script>

</body>

</html>

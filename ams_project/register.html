<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <style>
        /* Page Formatting */
        body {
            font-family: Arial, sans-serif;
            background-color: #e9edf3;
            font-size: 14px;
        }

        /* Form container */
        form {
            width: 380px;
            margin: 60px auto;
            padding: 25px;
            background-color: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        /* Form heading */
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 15px;
        }

        /* Labels */
        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
            color: #444;
        }

        /* Input fields */
        input[type="text"],
        input[type="password"],
        select {
            width: 100%;
            padding: 9px;
            margin-top: 5px;
            border: 1px solid #bfc5ce;
            border-radius: 4px;
            font-size: 14px;
        }

        /* Input focus effect */
        input:focus,
        select:focus {
            border-color: #2c7be5;
            outline: none;
        }

        /* Submit button */
        input[type="submit"] {
            width: 100%;
            padding: 11px;
            margin-top: 20px;
            background-color: #2c7be5;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 15px;
            cursor: pointer;
        }

        /* Button hover effect */
        input[type="submit"]:hover {
            background-color: #1a5cb8;
        }

        /* Error messages */
        .error {
            color: #c62828;
            font-size: 12px;
            margin-top: 3px;
        }
    </style>
</head>

<body>
    <form action="handle_register.php" method="post">
        <label>National ID</label>
        <input type="text" id="national_id" name="national_id">
        <span class="error" id="nidErr"></span>

        <label>Business ID (Optional)</label>
        <input type="text" name="business_id">

        <label>Role</label>
        <select id="role_id" name="role_id">
            <option value="">-- Select Role --</option>
            <option value="1">Consigner</option>
            <option value="2">Bidder</option>

        </select>
        <span class="error" id="roleErr"></span>

        <label>First Name</label>
        <input type="text" id="firstname" name="firstname">
        <span class="error" id="fnameErr"></span>

        <label>Second Name (Optional)</label>
        <input type="text" name="secondname">

        <label>Surname</label>
        <input type="text" id="surname" name="surname">
        <span class="error" id="surnameErr"></span>

        <label>Business Name (Optional)</label>
        <input type="text" name="business_name">

        <label>Phone Number</label>
        <input type="text" id="phone" name="phone_number">
        <span class="error" id="phoneErr"></span>

        <label>Email</label>
        <input type="text" id="email" name="email">
        <span class="error" id="emailErr"></span>

        <label>Username</label>
        <input type="text" id="username" name="username">
        <span class="error" id="userErr"></span>

        <label>Password</label>
        <input type="password" id="password" name="password">
        <span class="error" id="passErr"></span>

        <input type="submit" value="Register">
    </form>

    <script>
        function validateForm() {
            var valid = true;

            function error(id, msg) {
                document.getElementById(id).innerHTML = msg;
                valid = false;
            }

            // Clear errors
            var errors = document.getElementsByClassName("error");
            for (var i = 0; i < errors.length; i++) {
                errors[i].innerHTML = "";
            }

            // Get values
            var national_id = document.getElementById("national_id").value;
            var role_id = document.getElementById("role_id").value;
            var firstname = document.getElementById("firstname").value;
            var surname = document.getElementById("surname").value;
            var phone = document.getElementById("phone").value;
            var email = document.getElementById("email").value;
            var username = document.getElementById("username").value;
            var password = document.getElementById("password").value;

            // Validation rules
            if (national_id == "") error("nidErr", "National ID required");
            if (role_id == "") error("roleErr", "Select a role");
            if (firstname == "") error("fnameErr", "First name required");
            if (surname == "") error("surnameErr", "Surname required");
            if (phone == "") error("phoneErr", "Phone number required");
            if (email == "" || email.indexOf("@") == -1) error("emailErr", "Valid email required");
            if (username.length < 4) error("userErr", "Username must be at least 4 characters");
            if (password.length < 6) error("passErr", "Password must be at least 6 characters");

            return valid;
        }
    </script>

</body>

</html>
